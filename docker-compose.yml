services:
  postgres:
    image: postgres:17-alpine
    container_name: hustivoo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:  ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hustivoo -d hustivoo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: