spring.application.name=hustivoo-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hustivoo
spring.datasource.username=hustivoo
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Server
server.port=8080
# Session authentication (local same-origin HTTP development)
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Keep framework diagnostics from logging validation values or credential bindings.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Private receipt storage, outside the repository. No public resource handler is registered.
hustivoo.receipts.directory=${RECEIPT_STORAGE_DIRECTORY:${user.home}/.hustivoo/receipts}
hustivoo.receipts.max-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
